name: Generate Top Languages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate language card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          username = "rounak7781-arch"
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          req = urllib.request.Request(
              f"https://api.github.com/users/{username}/repos?per_page=100",
              headers=headers
          )

          repos = json.load(urllib.request.urlopen(req))

          totals = {}

          for repo in repos:
              if repo.get("fork"):
                  continue

              url = repo.get("languages_url")
              req = urllib.request.Request(url, headers=headers)

              try:
                  languages = json.load(urllib.request.urlopen(req))
              except Exception:
                  continue

              for language, bytes_count in languages.items():
                  totals[language] = totals.get(language, 0) + bytes_count

          top = sorted(totals.items(), key=lambda x: x[1], reverse=True)[:6]
          total = sum(value for _, value in top)

          colors = {
              "Python": "#3572A5",
              "Java": "#b07219",
              "JavaScript": "#f1e05a",
              "HTML": "#e34c26",
              "CSS": "#563d7c",
              "C": "#555555",
              "C++": "#f34b7d",
              "TypeScript": "#3178c6",
              "Shell": "#89e051"
          }

          svg = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">',
              '<rect width="700" height="360" rx="16" fill="#0d1117"/>',
              '<text x="40" y="55" fill="#ffffff" font-size="28" font-family="Arial" font-weight="bold">💻 Top Languages</text>'
          ]

          y = 105

          for language, value in top:
              percent = (value / total * 100) if total else 0
              bar_width = percent * 5

              color = colors.get(language, "#8b949e")

              svg.append(
                  f'<text x="40" y="{y}" fill="#c9d1d9" font-size="18" font-family="Arial">{language}</text>'
              )

              svg.append(
                  f'<rect x="180" y="{y-17}" width="450" height="20" rx="10" fill="#21262d"/>'
              )

              svg.append(
                  f'<rect x="180" y="{y-17}" width="{bar_width}" height="20" rx="10" fill="{color}"/>'
              )

              svg.append(
                  f'<text x="645" y="{y}" fill="#8b949e" font-size="16" font-family="Arial" text-anchor="end">{percent:.1f}%</text>'
              )

              y += 42

          svg.append("</svg>")

          os.makedirs("dist", exist_ok=True)

          with open("dist/top-languages.svg", "w", encoding="utf-8") as f:
              f.write("\n".join(svg))
          PY

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/top-languages.svg
          git diff --cached --quiet || git commit -m "Update top languages"
          git push
